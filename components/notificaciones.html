<!-- Historial local de notificaciones compartido por las páginas de la biblioteca. -->
<div class="notification-center">
  <button
    class="icon-btn notification-toggle"
    id="notificationToggle"
    type="button"
    aria-label="Notificaciones"
    aria-controls="notificationPanel"
    aria-expanded="false"
    title="Notificaciones"
  >
    <svg
      aria-hidden="true"
      class="icon"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"></path>
    </svg>
    <span
      class="notification-count"
      id="notificationCount"
      aria-hidden="true"
      hidden
    ></span>
  </button>
  <section
    class="notification-panel"
    id="notificationPanel"
    aria-labelledby="notificationTitle"
    hidden
  >
    <div class="notification-header">
      <h2 class="card-title" id="notificationTitle">Notificaciones</h2>
      <button
        class="icon-btn"
        id="notificationClose"
        type="button"
        aria-label="Cerrar historial de notificaciones"
      >
        ×
      </button>
    </div>
    <p class="notification-empty" id="notificationEmpty">
      No tienes notificaciones guardadas.
    </p>
    <ol class="notification-list" id="notificationList"></ol>
    <div class="notification-footer">
      <button
        class="btn btn-ghost btn-sm"
        id="notificationClear"
        type="button"
        disabled
      >
        Vaciar historial
      </button>
    </div>
  </section>
</div>
